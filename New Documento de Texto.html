<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Sorteio FM Champions</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #0a1f44, #020617);
    color: white;
    text-align: center;
}

/* container */
.container {
    padding: 30px;
}

/* título */
h1 {
    font-size: 34px;
    letter-spacing: 2px;
    text-transform: uppercase;
}

/* botão */
button {
    padding: 14px;
    font-size: 16px;
    background: linear-gradient(90deg,#2563eb,#1d4ed8);
    border: none;
    border-radius: 10px;
    color: white;
    cursor: pointer;
}

/* card */
.row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 12px auto;
    padding: 14px 18px;
    max-width: 420px;
    background: rgba(255,255,255,0.08);
    border-radius: 12px;

    opacity: 0;
    transform: translateY(20px) scale(0.95);
}

/* entrada com impacto */
.show {
    animation: reveal 0.5s forwards;
}

@keyframes reveal {
    0% {
        opacity: 0;
        transform: translateY(20px) scale(0.9);
    }
    60% {
        transform: translateY(-5px) scale(1.03);
    }
    100% {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* equipa */
.team {
    display: flex;
    align-items: center;
    gap: 10px;
}

/* logo com glow elegante */
.logo {
    width: 34px;
    height: 34px;
    object-fit: contain;

    filter: drop-shadow(0 0 6px #3b82f6);
    transition: 0.3s;
}

.logo:hover {
    filter: drop-shadow(0 0 12px #60a5fa);
    transform: scale(1.05);
}

/* nome equipa */
.team-name {
    font-weight: 600;
    letter-spacing: 0.5px;
}

/* jogador */
.player {
    font-weight: bold;
}

/* placeholder suspense */
.loading {
    opacity: 0.6;
    font-style: italic;
    animation: pulse 1s infinite;
}

@keyframes pulse {
    0% { opacity: 0.3; }
    50% { opacity: 1; }
    100% { opacity: 0.3; }
}
</style>
</head>

<body>

<audio id="bgmusic" src="./ucl.mp3" loop></audio>

<div class="container">
    <h1>🏆 Sorteio Champions FM</h1>
    <button onclick="start()">COMEÇAR SORTEIO</button>

    <div id="resultado"></div>
</div>

<script>

const jogadores = [
    "Gonçalo","Rato","Chico","Nabais",
    "Gamy","Painatal","Cardoso","Hugo"
];

const equipas = [
    {nome:"Rijeka", img:"Rijeka.png"},
    {nome:"Osijek", img:"Osijek.png"},
    {nome:"Lokomotiva", img:"NK LokomotivA.png"},
    {nome:"Slaven Belupo", img:"SLAVEN.png"},
    {nome:"Istra 1961", img:"ISTRA.png"},
    {nome:"HNK Gorica", img:"GORICA.png"},
    {nome:"Vukovar", img:"HNKVUKOVAR.png"},
    {nome:"Varaždin", img:"Varazdin.png"}
];

function shuffle(a){
    for(let i=a.length-1;i>0;i--){
        let j=Math.floor(Math.random()*(i+1));
        [a[i],a[j]]=[a[j],a[i]];
    }
}

async function start(){

    let j=[...jogadores];
    let e=[...equipas];

    shuffle(j);
    shuffle(e);

    let container=document.getElementById("resultado");
    container.innerHTML="";

    for(let i=0;i<j.length;i++){

        // suspense (tempo antes de mostrar)
        await new Promise(r=>setTimeout(r,1200));

        // placeholder tipo "a sair"
        let loading = document.createElement("div");
        loading.className = "row loading";
        loading.innerText = " A abrir a bola... ";
        container.appendChild(loading);

        // mais suspense
        await new Promise(r=>setTimeout(r,1000));

        container.removeChild(loading);

        let div=document.createElement("div");
        div.className="row";

        div.innerHTML = `
            <div class="team">
                <img class="logo" src="${e[i].img}">
                <span class="team-name">${e[i].nome}</span>
            </div>

            <div class="player">${j[i]}</div>
        `;

        container.appendChild(div);

        setTimeout(() => div.classList.add("show"), 50);

        // pausa para reação
        await new Promise(r=>setTimeout(r,1200));
    }
}

/* música */
let musicStarted = false;
function startMusic() {
    if (!musicStarted) {
        let music = document.getElementById("bgmusic");
        music.volume = 0.5;
        music.play();
        musicStarted = true;
    }
}

document.addEventListener("click", startMusic);

</script>

</body>
</html>
